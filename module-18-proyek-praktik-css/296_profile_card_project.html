<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>296 - Profile Card Project</title>
  <link rel="stylesheet" href="296_profile_card_project.css">
  <style>body { font-family: 'Segoe UI', sans-serif; background: #f1f5f9; padding: 20px; margin: 0; }</style>
</head>
<body>
  <div class="profile-card">
    <div class="profile-card__cover"></div>
    <div class="profile-card__avatar-box">
      <div class="profile-card__avatar">Y</div>
      <div class="profile-card__status-dot"></div>
    </div>
    <h3 class="profile-card__name">Yohanes Dimas Pratama</h3>
    <p class="profile-card__role">Frontend Engineer &amp; Designer</p>
    <p class="profile-card__bio">Membangun pengalaman antarmuka web modern, cepat, aksesibel, dan berdaya guna tinggi.</p>
    
    <div class="profile-card__stats">
      <div class="stat-item">
        <span class="stat-item__value">48</span>
        <span class="stat-item__label">Proyek</span>
      </div>
      <div class="stat-item">
        <span class="stat-item__value">12.4k</span>
        <span class="stat-item__label">Pengikut</span>
      </div>
      <div class="stat-item">
        <span class="stat-item__value">4.9</span>
        <span class="stat-item__label">Rating</span>
      </div>
    </div>

    <div class="profile-card__actions">
      <button class="btn-follow">Ikuti</button>
      <button class="btn-message">Kirim Pesan</button>
    </div>
  </div>
</body>
</html>

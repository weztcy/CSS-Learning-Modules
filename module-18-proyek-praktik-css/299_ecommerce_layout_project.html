<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>299 - E-Commerce Layout Project</title>
  <link rel="stylesheet" href="299_ecommerce_layout_project.css">
  <style>body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; padding: 20px; margin: 0; }</style>
</head>
<body>
  <div class="shop-wrapper">
    <div class="shop-header">
      <h2 class="shop-title">Produk Unggulan</h2>
      <span style="font-size:13px; color:#64748b;">Menampilkan 3 dari 24 item</span>
    </div>

    <div class="product-grid">
      <!-- Produk 1 -->
      <div class="product-card">
        <span class="badge-sale">DISKON 20%</span>
        <div class="product-image">&#127911;</div>
        <div class="product-details">
          <span class="product-category">Audio</span>
          <h4 class="product-title">Headphone Nirkabel ANC</h4>
          <div class="product-rating">&#9733;&#9733;&#9733;&#9733;&#9733; (4.9)</div>
          <div class="product-pricing">
            <span class="price-current">Rp 799.000</span>
            <span class="price-original">Rp 999.000</span>
          </div>
          <button class="btn-buy">+ Keranjang</button>
        </div>
      </div>

      <!-- Produk 2 -->
      <div class="product-card">
        <div class="product-image">&#8986;</div>
        <div class="product-details">
          <span class="product-category">Wearable</span>
          <h4 class="product-title">Smartwatch Fitness Pro</h4>
          <div class="product-rating">&#9733;&#9733;&#9733;&#9733;&#9734; (4.6)</div>
          <div class="product-pricing">
            <span class="price-current">Rp 1.150.000</span>
          </div>
          <button class="btn-buy">+ Keranjang</button>
        </div>
      </div>

      <!-- Produk 3 -->
      <div class="product-card">
        <span class="badge-sale">PROMO</span>
        <div class="product-image">&#128187;</div>
        <div class="product-details">
          <span class="product-category">Komputer</span>
          <h4 class="product-title">Dudukan Laptop Aluminium</h4>
          <div class="product-rating">&#9733;&#9733;&#9733;&#9733;&#9733; (5.0)</div>
          <div class="product-pricing">
            <span class="price-current">Rp 245.000</span>
            <span class="price-original">Rp 300.000</span>
          </div>
          <button class="btn-buy">+ Keranjang</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>

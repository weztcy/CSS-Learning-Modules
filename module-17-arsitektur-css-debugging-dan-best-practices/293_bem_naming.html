<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>293 - BEM Naming</title>
  <link rel="stylesheet" href="293_bem_naming.css">
  <style>body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; padding: 20px; display: flex; gap: 20px; justify-content: center; }</style>
</head>
<body>
  <!-- Kartu Standar -->
  <div class="card">
    <div class="card__header">
      <h3 class="card__title">Paket Dasar</h3>
    </div>
    <div class="card__body">
      <p class="card__text">Fitur standar untuk pemula dengan dukungan komunitas.</p>
      <button class="card__button">Pilih Paket</button>
    </div>
  </div>

  <!-- Kartu dengan Modifier (card--featured) -->
  <div class="card card--featured">
    <div class="card__header">
      <h3 class="card__title">Paket Profesional &#9733;</h3>
    </div>
    <div class="card__body">
      <p class="card__text">Fitur lengkap tanpa batas dengan bantuan teknis 24/7.</p>
      <button class="card__button card__button--primary">Mulai Langganan</button>
    </div>
  </div>
</body>
</html>

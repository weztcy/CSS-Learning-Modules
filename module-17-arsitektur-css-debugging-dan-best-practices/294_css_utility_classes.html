<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>294 - CSS Utility Classes</title>
  <link rel="stylesheet" href="294_css_utility_classes.css">
  <style>body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; padding: 30px; }</style>
</head>
<body>
  <!-- Komponen notifikasi yang dirakit hanya dengan Utility Classes -->
  <div class="d-flex align-center justify-between p-4 bg-white rounded-md shadow-sm border" style="max-width: 440px; margin: auto;">
    <div class="d-flex align-center gap-4">
      <div class="bg-success text-white rounded-full d-flex align-center justify-center" style="width: 36px; height: 36px; font-weight:bold;">
        ✓
      </div>
      <div>
        <p class="m-0 font-bold text-sm">Pembayaran Berhasil</p>
        <p class="m-0 text-gray text-sm">Pesanan #9910 telah dikonfirmasi.</p>
      </div>
    </div>
    <span class="text-sm font-medium text-gray">Baru saja</span>
  </div>

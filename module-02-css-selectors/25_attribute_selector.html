<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>25 - Attribute Selector</title>
  <link rel="stylesheet" href="25_attribute_selector.css">
  <style>body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; padding: 30px; max-width: 500px; margin: 0 auto; }</style>
</head>
<body>
  <div style="background: white; padding: 25px; border-radius: 8px;">
    <h3>Keberadaan Atribut [required]</h3>
    <form>
      <label>Email (Wajib Diisi):</label><br>
      <input type="email" required placeholder="nama@domain.com"><br><br>
      <a href="https://example.com" target="_blank">Buka Tautan Tab Baru &rarr;</a>
    </form>
  </div>
</body>

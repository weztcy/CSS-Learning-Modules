<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>81 - Properti Text-Transform</title>
  <link rel="stylesheet" href="81_text_transform.css">
  <style>body { font-family: 'Segoe UI', sans-serif; background: #f1f5f9; padding: 40px; }</style>
</head>
<body>
  <div style="background: white; padding: 25px; border-radius: 8px; max-width: 500px; margin: 0 auto;">
    <!-- Teks di HTML ditulis huruf kecil, namun CSS mengubahnya -->
    <span class="transform-uppercase">modul pembelajaran unggulan</span>
    <h3 class="transform-capitalize">panduan lengkap tipografi dan rekayasa web modern</h3>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>61 - Margin Collapse</title>
  <link rel="stylesheet" href="61_margin_collapse.css">
  <style>body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; padding: 30px; max-width: 500px; margin: 0 auto; }</style>
</head>
<body>
  <h3>Demonstrasi Margin Collapsing</h3>
  <div class="box-top">Kotak Atas (margin-bottom: 30px)</div>
  <div class="box-bottom">Kotak Bawah (margin-top: 20px)</div>
  <p style="color: #64748b; font-size: 13px; margin-top: 15px;">
    Jarak aktual di antara kedua kotak adalah 30px karena margin melebur (collapse) ke nilai terbesar.
  </p>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>185 - Grid Dashboard Layout</title>
  <link rel="stylesheet" href="185_grid_dashboard_layout.css">
  <style>body { font-family: 'Segoe UI', sans-serif; background: #fafafa; padding: 20px; }</style>
</head>
<body>
  <div class="dashboard-grid">
    <div class="metric-widget">
      <small style="color:#64748b;">Total Siswa</small>
      <h3 style="margin:4px 0 0 0; color:#2563eb;">3.450</h3>
    </div>
    <div class="metric-widget">
      <small style="color:#64748b;">Penyelesaian</small>
      <h3 style="margin:4px 0 0 0; color:#10b981;">98.2%</h3>
    </div>
    <div class="chart-widget">
      <h4 style="margin:0 0 8px 0; color:#0f172a;">Aktivitas Pembelajaran Mingguan</h4>
      <div style="height:60px; background:#eff6ff; border-radius:4px; display:flex; align-items:center; justify-content:center; color:#3b82f6; font-size:13px;">
        [Grafik Metrik Grid Penuh 100%]
      </div>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>285 - Button Component</title>
  <link rel="stylesheet" href="285_button_component.css">
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; padding: 30px; }
    .card { background: white; padding: 24px; border-radius: 12px; max-width: 550px; margin: auto; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
  </style>
</head>
<body>
  <div class="card">
    <h3 style="margin-top:0;">Sistem Komponen Tombol</h3>
    
    <div class="row">
      <button class="btn btn-primary">Primary Action</button>
      <button class="btn btn-secondary">Secondary</button>
      <button class="btn btn-danger">Delete</button>
      <button class="btn btn-ghost">Ghost</button>
    </div>

    <div class="row">
      <button class="btn btn-primary btn-sm">Small Button</button>
      <button class="btn btn-primary">Regular Button</button>
      <button class="btn btn-primary btn-lg">Large Button</button>
    </div>

    <div class="row">
      <button class="btn btn-primary" disabled>Primary (Disabled)</button>
      <button class="btn btn-secondary" disabled>Secondary (Disabled)</button>
    </div>
  </div>
</body>
</html>

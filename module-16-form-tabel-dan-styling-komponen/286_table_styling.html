<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>286 - Table Styling</title>
  <link rel="stylesheet" href="286_table_styling.css">
  <style>body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; padding: 20px; }</style>
</head>
<body>
  <div class="table-wrapper">
    <table class="data-table">
      <thead>
        <tr>
          <th>Kode Produk</th>
          <th>Nama Item</th>
          <th class="text-right">Stok</th>
          <th class="text-right">Harga</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>PRD-001</td>
          <td>Keyboard Mekanikal TKL</td>
          <td class="text-right">24</td>
          <td class="text-right">Rp 450.000</td>
        </tr>
        <tr>
          <td>PRD-002</td>
          <td>Mouse Nirkabel Ergonomis</td>
          <td class="text-right">18</td>
          <td class="text-right">Rp 275.000</td>
        </tr>
        <tr>
          <td>PRD-003</td>
          <td>Monitor 24 Inci Full HD</td>
          <td class="text-right">9</td>
          <td class="text-right">Rp 1.650.000</td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>

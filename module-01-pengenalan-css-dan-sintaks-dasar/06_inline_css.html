<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>06 - Inline CSS</title>
  <link rel="stylesheet" href="06_inline_css.css">
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #fafafa; padding: 40px; max-width: 600px; margin: 0 auto; }
  </style>
</head>
<body>
  <h2>Demonstrasi Inline CSS vs External CSS</h2>
  
  <div class="external-styled-box">
    <strong>Gaya Eksternal:</strong> Ditata murni menggunakan kelas CSS dari file eksternal.
  </div>

  <!-- Inline CSS diaplikasikan langsung melalui atribut style -->
  <div class="demo-box" style="background-color: #fee2e2; border: 2px solid #ef4444; color: #991b1b; font-weight: bold;">
    <strong>Gaya Inline CSS:</strong> Latar merah muda dan border merah ini didefinisikan langsung pada atribut style tag div ini.
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>12 - Case Sensitivity pada CSS</title>
  <link rel="stylesheet" href="12_css_case_sensitivity.css">
  <style>body { font-family: 'Segoe UI', sans-serif; background: #fafafa; padding: 40px; max-width: 600px; margin: 0 auto; }</style>
</head>
<body>
  <h2>Pengujian Case Sensitivity</h2>
  
  <div class="alertBox">
    <strong>class="alertBox"</strong> — Berhasil menerima styling oranye karena nama kelas persis sama.
  </div>

  <div class="ALERTBOX">
    <strong>class="ALERTBOX"</strong> — Menerima styling ungu karena ditargetkan oleh selector kapital terpisah.
  </div>
</body>

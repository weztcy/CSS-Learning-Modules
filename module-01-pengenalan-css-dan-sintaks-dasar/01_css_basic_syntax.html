<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>01 - Sintaks Dasar CSS</title>
  <link rel="stylesheet" href="01_css_basic_syntax.css">
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f8fafc; padding: 40px; margin: 0; }
    .card { background: #ffffff; border-radius: 8px; padding: 30px; max-width: 650px; margin: 0 auto; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .badge { display: inline-block; background: #e0e7ff; color: #3730a3; padding: 4px 10px; border-radius: 9999px; font-size: 12px; font-weight: 600; margin-bottom: 15px; }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Submodul 01</span>
    <h1>Belajar Sintaks Dasar CSS</h1>
    <p class="intro-text">
      CSS (Cascading Style Sheets) bekerja dengan memilih elemen HTML menggunakan selector,
      kemudian memberikan deklarasi visual berupa pasangan properti dan nilai di dalam kurung kurawal.
    </p>
  </div>
</body>
</html>
